[project]
name = "patch-kokoro-sidecar"
version = "0.1.0"
description = "Long-running Kokoro TTS sidecar for the patch daemon. PCM16 24 kHz streamed over a WebSocket."
requires-python = ">=3.11,<3.13"
dependencies = [
    "websockets>=12.0",
    "kokoro>=0.9.2",
    "torch>=2.2",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.scripts]
patch-kokoro-sidecar = "patch_kokoro_sidecar.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patch_kokoro_sidecar"]
