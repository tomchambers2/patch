[project]
name = "patch-whisper-sidecar"
version = "0.1.0"
description = "Long-running faster-whisper STT sidecar for the patch daemon. PCM16 16 kHz in, transcript out, over a WebSocket."
requires-python = ">=3.11,<3.13"
dependencies = [
    "websockets>=12.0",
    "faster-whisper>=1.0",
    "numpy>=1.26",
]

[project.scripts]
patch-whisper-sidecar = "patch_whisper_sidecar.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patch_whisper_sidecar"]
