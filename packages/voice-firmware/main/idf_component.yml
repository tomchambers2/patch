# Patch voice-device firmware — pinned external IDF dependencies.
#
# Versions are pinned per spec/principles.md (no fallbacks; reproducible
# builds). Tested with ESP-IDF v5.3.2 — see README.md.

dependencies:
  idf:
    version: '==5.3.2'

  espressif/esp-tflite-micro:
    # TFLite-Micro runtime for microWakeWord — the on-device wake-word engine
    # HA Assist uses (spec/16-voice-device.md, spec/18-tech-stack.md). Provides
    # the MicroInterpreter, the (esp-nn accelerated) op kernels, and
    # resource-variable support. The microWakeWord audio "micro frontend"
    # feature lib + the pretrained hey_jarvis model are vendored in
    # components/patch_wakeword (esp-tflite-micro does not ship the frontend).
    version: '==1.3.3'

  espressif/led_strip:
    # WS2812 driver via RMT.
    version: '==2.5.5'

  espressif/esp_websocket_client:
    # ESP-IDF managed-component build of the websocket client.
    version: '==1.4.0'

  espressif/libsodium:
    # Ed25519 keypair for surface credential generation in the QR-link
    # pairing flow.
    version: '==1.0.20~1'
